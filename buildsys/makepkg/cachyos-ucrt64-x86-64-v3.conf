# [NV] untested: no local build allowed. Drop-in sourced after makepkg_mingw.d.ucrt64.conf.
# Philosophy: CachyOS ../src/third_party/CachyOS-PKGBUILDS/pacman/makepkg.conf (-O3, LTO), adapted to PE/COFF:
# ELF-only flags (-fno-plt, -z relro/now, pack-relative-relocs, -fcf-protection on mingw) dropped.
CC="clang"; CXX="clang++"; LD="ld.lld"  # ucrt64 rebased on clang (CachyOS clang-by-default)
CFLAGS="-march=x86-64-v3 -mtune=x86-64-v3 -O3 -pipe -Wp,-D_FORTIFY_SOURCE=2 -fstack-protector-strong -Wp,-D__USE_MINGW_ANSI_STDIO=1"
CXXFLAGS="$CFLAGS"
LDFLAGS="-fuse-ld=lld -Wl,-O1 -Wl,--icf=all"
LTOFLAGS="-flto=thin"
# PGO/AutoFDO: per-package opt-in (profile from prd; llvm-profdata merge), see docs/MATRIX.md#optimisation
OPTIONS=(strip docs !libtool staticlibs emptydirs zipman purge !debug lto !autodeps)
